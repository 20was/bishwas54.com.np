name: Draft from inbox

# Turns raw notes in inbox/ into a structured draft post via Claude,
# opened as a DRAFT pull request. A human (Bishwas) reviews, edits,
# adds personal experience, and merges. Nothing publishes without review.

on:
  push:
    branches: [main]
    paths: ['inbox/**']
  workflow_dispatch:
    inputs:
      note:
        description: 'Raw note text to draft from (optional if inbox/ has files)'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: '--allowed-tools "Bash(git:*),Bash(gh pr create:*),Read,Write,Glob,Grep"'
          prompt: |
            You are the content-drafting assistant for bishwas54.com.np, the
            learning notebook of Bishwas Adhikari. Your job: turn raw notes
            into a structured DRAFT post, opened as a draft PR for human review.

            INPUT: ${{ inputs.note != '' && format('The raw note is:\n\n{0}', inputs.note) || 'Read the newest file(s) in inbox/ — each file is one raw note.' }}

            PROCESS (follow in order):
            1. Extract the note's central idea. If the note is too thin to
               support a post, open an issue instead of a PR and stop.
            2. Decide: tutorial (teachable, step-by-step) or note (small tip).
            3. Outline, then draft in MDX using ONLY information present in
               the raw note plus well-established general knowledge. Where
               the note is ambiguous or missing context, insert
               "<!-- QUESTION FOR BISHWAS: ... -->" comments — never guess.
            4. Style: beginner-friendly, plain words, short paragraphs, first
               person only for verifiable facts about the writing itself —
               NEVER invent personal experiences, anecdotes, numbers, project
               status, or citations. Never claim code was run or tested.
            5. Frontmatter must match src/content.config.ts schema. Set
               aiAssisted: true and draft: true. Tags: conservative, reuse
               existing tags from other posts where possible.
            6. Tutorials end with a <Quiz> of 3 questions drawn only from the
               draft's own content (see src/content/tutorials/what-is-git.mdx
               for component usage). IMPORTANT: never nest markdown code
               fences inside JSX component bodies — it breaks the build.
            7. Delete the processed inbox file(s) in the same branch.
            8. Create a branch draft/<slug>, commit, push, and open a DRAFT
               pull request (gh pr create --draft) whose body lists: the
               source note, every open question, and a review checklist
               (facts verified · personal experience added · quiz sensible ·
               draft flag removed).

            HARD RULES:
            - Never modify files outside src/content/ and inbox/.
            - Never touch existing published posts.
            - Never open a non-draft PR, never merge, never push to main.
