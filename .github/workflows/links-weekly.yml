name: External links (weekly)

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build

      # --root-dir is required for the site's root-relative hrefs ("/about/")
      # to resolve against dist/ — without it every internal link is reported
      # as an error and drowns out the real external failures.
      - name: Check external links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --root-dir ${{ github.workspace }}/dist
            --accept 200,204,206,301,302,308,429
            --max-retries 2
            "dist/**/*.html"
          fail: false

      # Reuse the existing report issue instead of opening a new one every
      # Monday until the link is fixed.
      - name: Find existing report issue
        if: steps.lychee.outputs.exit_code != 0
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number="$(gh issue list --repo "$GITHUB_REPOSITORY" \
            --state open --label maintenance --limit 1 \
            --search 'Broken external links found in:title' \
            --json number --jq '.[0].number // ""')"
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Open or update issue on broken links
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: 'Broken external links found'
          content-filepath: ./lychee/out.md
          labels: maintenance
          issue-number: ${{ steps.existing.outputs.number }}
